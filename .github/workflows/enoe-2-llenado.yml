# Cifra Pública | Folio 003 | ENOE, paso 2: llenar la serie desde 2019 (unos 30 trimestres, ~1 GB de
# descarga, alrededor de media hora). Se corre a mano una vez. Abre un PR con todo y el control.
name: "ENOE | 2. llenado"

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Primer trimestre (AAAA-T)"
        required: true
        default: "2019-1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: enoe
  cancel-in-progress: false

jobs:
  llenado:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/enoe/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/enoe/requirements.txt

      - name: Extraer los trimestres que faltan
        id: extraer
        continue-on-error: true
        env:
          DESDE: ${{ inputs.desde }}
        run: python scripts/enoe/extraer.py --faltantes --desde "$DESDE" --max 60 --borrar-crudo

      - name: Consolidar y revisar
        run: python scripts/enoe/consolidar.py

      - name: Abrir PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          RAMA: enoe/llenado-${{ github.run_id }}
          DESDE: ${{ inputs.desde }}
        run: |
          bash scripts/enoe/abrir_pr.sh "$RAMA" "ENOE: serie desde $DESDE" \
            data/processed/enoe/control.md data/processed/enoe

      - name: Marcar la corrida como fallida si algún trimestre falló
        if: steps.extraer.outcome == 'failure'
        run: |
          echo "Algún trimestre no se pudo extraer: revisa el resumen de esta corrida."
          exit 1
