# Cifra Pública | Folio 003 | Paso 1: revisar el portal del IMSS antes de llenar la serie.
# Se corre a mano (Actions > «Empleo IMSS | 1. sondeo» > Run workflow). Abre un PR con el reporte.
name: "Empleo IMSS | 1. sondeo"

on:
  workflow_dispatch:
    inputs:
      mes:
        description: "Mes a revisar (AAAA-MM). Vacío = el más reciente."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: empleo-imss
  cancel-in-progress: false

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/empleo/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/empleo/requirements.txt

      - name: Sondeo del portal
        id: sondeo
        continue-on-error: true
        env:
          MES: ${{ inputs.mes }}
        run: |
          if [ -n "$MES" ]; then
            python scripts/empleo/sondeo.py --mes "$MES"
          else
            python scripts/empleo/sondeo.py
          fi

      - name: Abrir PR con el reporte
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          RAMA: empleo/sondeo-${{ github.run_id }}
        run: |
          bash scripts/empleo/abrir_pr.sh "$RAMA" "Empleo IMSS: sondeo del portal" \
            data/fuentes/empleo/sondeo/reporte.md data/fuentes/empleo/sondeo

      - name: Marcar la corrida como fallida si el sondeo falló
        if: steps.sondeo.outcome == 'failure'
        run: |
          echo "El sondeo falló: el detalle está en el reporte (y en el PR, si se abrió)."
          exit 1
