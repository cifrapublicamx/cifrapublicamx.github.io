# Cifra Pública | Folio 003 | ENOE, paso 1: revisar que el INEGI deja descargar y que el cálculo
# por ciudad reproduce lo publicado. Se corre a mano. Abre un PR con el reporte.
name: "ENOE | 1. sondeo"

on:
  workflow_dispatch:
    inputs:
      trimestres:
        description: "Trimestres a revisar (AAAA-T separados por espacio). Vacío = el más reciente, 2021-4 y 2019-4."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: enoe
  cancel-in-progress: false

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/enoe/requirements.txt

      - name: Instalar dependencias
        run: pip install -r scripts/enoe/requirements.txt

      - name: Sondeo de la ENOE
        id: sondeo
        continue-on-error: true
        env:
          TRIMESTRES: ${{ inputs.trimestres }}
        run: |
          if [ -n "$TRIMESTRES" ]; then
            # shellcheck disable=SC2086
            python scripts/enoe/sondeo.py --trimestres $TRIMESTRES
          else
            python scripts/enoe/sondeo.py
          fi

      - name: Abrir PR con el reporte
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.repository.default_branch }}
          RAMA: enoe/sondeo-${{ github.run_id }}
        run: |
          bash scripts/enoe/abrir_pr.sh "$RAMA" "ENOE: sondeo del INEGI" \
            data/fuentes/enoe/sondeo/reporte.md data/fuentes/enoe/sondeo

      - name: Marcar la corrida como fallida si el sondeo falló
        if: steps.sondeo.outcome == 'failure'
        run: |
          echo "El sondeo falló: el detalle está en el resumen de esta corrida."
          exit 1
